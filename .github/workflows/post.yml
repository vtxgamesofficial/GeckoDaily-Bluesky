
sadas

name: GeckoDaily Bluesky bot

on:
  # Start automatically every 5 minutes.
  # The concurrency lock prevents a second bot from starting
  # while the previous one is still running.
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch: {}

concurrency:
  group: geckodaily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest

    # Let one bot session run for up to 6 hours.
    timeout-minutes: 360

    environment: geckodaily
asd
    steps:
      - uses: actions/checkout@v4
sad
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
asd
      - name: Install dependencies
        run: npm install
asd
      - name: Run GeckoDaily Bluesky bot
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SITE_BASE_URL: https://geckodaily.cc.cd
          SITE_FEED_KEY: ${{ secrets.SITE_FEED_KEY }}
        run: node index.js --daily
asda
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "geckodaily-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/state.json

          git diff --cached --quiet || git commit -m "chore: update bot state [skip ci]"

          git push
